<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sales forecast dashboard example</title>
  <desc id="desc">Forecast dashboard showing actual sales, three-month moving average, forecast indicators, and planning notes.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="line2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".25"/></filter></defs>
  <rect width="1400" height="820" fill="#f5f3ff"/><rect width="1400" height="150" fill="url(#bg2)"/>
  <text x="64" y="62" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Revenue Forecast &amp; Planning</text>
  <text x="64" y="101" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="17">Three-month moving-average model • Actual vs forecast • Example dashboard</text>
  <rect x="1120" y="48" width="210" height="52" rx="26" fill="#4338ca" stroke="#a78bfa"/><text x="1225" y="81" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="16" font-weight="700">FORECAST VIEW</text>
  <g filter="url(#shadow2)"><rect x="64" y="180" width="290" height="130" rx="16" fill="#ffffff"/><rect x="374" y="180" width="290" height="130" rx="16" fill="#ffffff"/><rect x="684" y="180" width="290" height="130" rx="16" fill="#ffffff"/><rect x="994" y="180" width="342" height="130" rx="16" fill="#ffffff"/></g>
  <text x="90" y="220" fill="#64748b" font-family="Arial, sans-serif" font-size="16">LATEST ACTUAL</text><text x="90" y="270" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">$83.8K</text><text x="90" y="293" fill="#64748b" font-family="Arial, sans-serif" font-size="14">December 2017</text>
  <text x="400" y="220" fill="#64748b" font-family="Arial, sans-serif" font-size="16">LATEST FORECAST</text><text x="400" y="270" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">$93.4K</text><text x="400" y="293" fill="#7c3aed" font-family="Arial, sans-serif" font-size="14">Three-month moving average</text>
  <text x="710" y="220" fill="#64748b" font-family="Arial, sans-serif" font-size="16">FORECAST CHANGE</text><text x="710" y="270" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">+11.4%</text><text x="710" y="293" fill="#16a34a" font-family="Arial, sans-serif" font-size="14">Forecast vs latest actual</text>
  <text x="1020" y="220" fill="#64748b" font-family="Arial, sans-serif" font-size="16">PEAK ACTUAL MONTH</text><text x="1020" y="270" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">Nov 2017</text><text x="1020" y="293" fill="#2563eb" font-family="Arial, sans-serif" font-size="14">$118.4K sales</text>
  <rect x="64" y="345" width="930" height="420" rx="16" fill="#ffffff" filter="url(#shadow2)"/><text x="94" y="390" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Actual Sales vs Moving-Average Forecast</text><text x="94" y="417" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Source: data/processed/sales_forecast.csv</text>
  <line x1="110" y1="690" x2="950" y2="690" stroke="#cbd5e1"/><line x1="110" y1="470" x2="110" y2="690" stroke="#cbd5e1"/><line x1="110" y1="580" x2="950" y2="580" stroke="#e2e8f0" stroke-dasharray="5 6"/><line x1="110" y1="470" x2="950" y2="470" stroke="#e2e8f0" stroke-dasharray="5 6"/>
  <text x="75" y="695" fill="#64748b" font-family="Arial, sans-serif" font-size="12">0</text><text x="38" y="585" fill="#64748b" font-family="Arial, sans-serif" font-size="12">60K</text><text x="38" y="475" fill="#64748b" font-family="Arial, sans-serif" font-size="12">120K</text>
