  <polyline fill="none" stroke="url(#line2)" stroke-width="5" stroke-dasharray="10 7" points="146,635 164,630 182,624 200,634 218,633 236,604 254,593 272,573 290,588 308,589 326,654 344,648 362,632 380,628 398,634 416,637 434,631 452,620 470,589 488,590 506,586 524,583 542,583 560,579 578,577 596,576 614,578 632,579 650,584 668,584 686,582 704,576 722,565 740,560 758,559 776,556 794,548 812,540 830,532 848,527 866,520 884,515 902,512 920,508 938,504"/>
  <circle cx="938" cy="536" r="7" fill="#cbd5e1" stroke="#ffffff" stroke-width="3"/><circle cx="938" cy="504" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="3"/>
  <line x1="130" y1="728" x2="158" y2="728" stroke="#cbd5e1" stroke-width="4"/><text x="166" y="733" fill="#475569" font-family="Arial, sans-serif" font-size="13">Actual sales</text><line x1="280" y1="728" x2="308" y2="728" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 5"/><text x="316" y="733" fill="#475569" font-family="Arial, sans-serif" font-size="13">3-month forecast</text>
  <rect x="1024" y="345" width="312" height="420" rx="16" fill="#ffffff" filter="url(#shadow2)"/><text x="1054" y="390" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Planning Signals</text><text x="1054" y="417" fill="#64748b" font-family="Arial, sans-serif" font-size="14">What the model suggests</text>
  <circle cx="1074" cy="478" r="18" fill="#dcfce7"/><text x="1074" y="484" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="19" font-weight="700">↗</text><text x="1108" y="475" fill="#334155" font-family="Arial, sans-serif" font-size="16" font-weight="700">Positive momentum</text><text x="1108" y="498" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Recent demand remains strong.</text>
  <circle cx="1074" cy="570" r="18" fill="#fef3c7"/><text x="1074" y="576" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="700">!</text><text x="1108" y="567" fill="#334155" font-family="Arial, sans-serif" font-size="16" font-weight="700">Use as a baseline</text><text x="1108" y="590" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Moving average is not a full</text><text x="1108" y="609" fill="#64748b" font-family="Arial, sans-serif" font-size="13">seasonality-aware model.</text>
  <circle cx="1074" cy="681" r="18" fill="#dbeafe"/><text x="1074" y="687" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="18" font-weight="700">✓</text><text x="1108" y="678" fill="#334155" font-family="Arial, sans-serif" font-size="16" font-weight="700">Plan inventory</text><text x="1108" y="701" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Compare forecast with category</text><text x="1108" y="720" fill="#64748b" font-family="Arial, sans-serif" font-size="13">profit before decisions.</text>
</svg>
